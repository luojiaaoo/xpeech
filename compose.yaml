configs:
  xpeech_conf:
    file: ./conf.toml
  opensandbox_conf:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8080
      api_key = "${OPENSANDBOX_API_KEY:?Set OPENSANDBOX_API_KEY}"
      max_sandbox_timeout_seconds = 86400
      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.1.0"
      [storage]
      allowed_host_paths = ["${XPEECH_HOST_DATA_PATH:?Set an absolute XPEECH_HOST_DATA_PATH}"]
      [docker]
      network_mode = "xpeech-net"
      drop_capabilities = ["SYS_ADMIN", "NET_ADMIN", "SYS_PTRACE", "SYS_MODULE"]
      no_new_privileges = true
      pids_limit = 4096
      [proxy]
      resolve_internal = true
      [ingress]
      mode = "direct"

x-xpeech-service: &xpeech-service
  image: xpeech:local
  build:
    context: .
    dockerfile: Dockerfile
    target: backend
  env_file:
    - ./.env
  environment:
    - TZ=Asia/Shanghai
  dns:
    - 10.123.14.6
    - 10.123.14.7
    - 223.5.5.5
    - 114.114.114.114
    - 8.8.8.8
  configs:
    - source: xpeech_conf
      target: /app/conf.toml
  init: true
  restart: unless-stopped
  networks: [xpeech-net]

services:
  opensandbox:
    image: opensandbox/server:release-1.1.0
    command: ["--config", "/etc/opensandbox.toml"]
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${XPEECH_HOST_DATA_PATH}:${XPEECH_HOST_DATA_PATH}
      - opensandbox-state:/root/.opensandbox
    configs:
      - source: opensandbox_conf
        target: /etc/opensandbox.toml
    networks: [xpeech-net]
    restart: unless-stopped

  runtime-image:
    image: xpeech-runtime:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: [build]

  lark-token-manager:
    <<: *xpeech-service
    command: ["token_manager", "--host", "0.0.0.0", "--port", "7883"]
    volumes:
      - ./docker_data/lark-token-manager:/app/data/lark-token-manager
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7883/health')"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  browserless:
    image: ghcr.io/browserless/chromium:v2.55.0
    init: true
    restart: unless-stopped
    networks: [xpeech-net]

  backend:
    <<: *xpeech-service
    command: ["api", "--host", "0.0.0.0", "--port", "${BACKEND_PORT:-7878}"]
    depends_on:
      opensandbox:
        condition: service_started
      browserless:
        condition: service_started
      lark-token-manager:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-7878}:${BACKEND_PORT:-7878}"
    volumes:
      # 内置技能及本地自定义内置技能（x-*）
      - ./xpeech/agent/skills/buildin:/app/xpeech/agent/skills/buildin:ro
      # 会话上下文
      - ${XPEECH_HOST_DATA_PATH}/session:/app/data/session
      # 工作目录
      - ${XPEECH_HOST_DATA_PATH}/workspace_base:/app/data/workspace_base
      # 沙盒内包管理器的国内镜像配置（逐用户只读映射到 HOME）
      - ${XPEECH_HOST_DATA_PATH}/sandbox-home:/app/data/sandbox-home:ro
      # 网页预览目录
      - ${XPEECH_HOST_DATA_PATH}/browser_preview:/app/data/browser_preview
      - ${XPEECH_HOST_DATA_PATH}/cache:/app/data/cache
      # 运行日志目录
      - ./docker_data/logs:/app/data/logs
      # 头像等
      - ./assets:/app/assets:ro
    environment:
      TZ: Asia/Shanghai
      XPEECH_SANDBOX__DOMAIN: opensandbox:8080
      XPEECH_SANDBOX__API_KEY: ${OPENSANDBOX_API_KEY}
      XPEECH_SANDBOX__HOST_DATA_PATH: ${XPEECH_HOST_DATA_PATH}
      XPEECH_SANDBOX__CALLBACK_URL: http://backend:${BACKEND_PORT:-7878}/internal/runtime
      XPEECH_SANDBOX__RUNTIME_ENV: '{"CDP_URL":"http://browserless:3000"}'
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:-7878}/health')"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  feishu:
    <<: *xpeech-service
    command: ["feishu", "--chat-url", "http://backend:${BACKEND_PORT:-7878}"]
    depends_on:
      backend:
        condition: service_healthy

  web_client:
    <<: *xpeech-service
    command: ["web_client", "--host", "0.0.0.0", "--port", "${WEB_CLIENT_PORT:-7939}", "--backend-url", "http://backend:${BACKEND_PORT:-7878}"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_CLIENT_PORT:-7939}:${WEB_CLIENT_PORT:-7939}"
    volumes:
      # Web 用户和登录会话数据库
      - ./docker_data/web_client:/app/data/web_client

networks:
  xpeech-net:
    name: xpeech-net

volumes:
  opensandbox-state:
