configs:
  xpeech_conf:
    file: ./conf.toml
  opensandbox_conf:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8080
      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.1.0"
      [proxy]
      resolve_internal = false
      [store]
      type = "sqlite"
      path = "/var/lib/opensandbox/state.db"
      [storage]
      allowed_host_paths = ["${XPEECH_HOST_ROOT:?Set XPEECH_HOST_ROOT to the absolute project directory}/docker_data/workspace_base", "${XPEECH_HOST_ROOT}/xpeech/agent/skills/buildin", "${XPEECH_HOST_ROOT}/data/sandbox-home", "${XPEECH_HOST_ROOT}/docker_data/lark-cli"]
      [docker]
      network_mode = "bridge"
      host_ip = "host.docker.internal"
      publish_host = "${SANDBOX_HOST_GATEWAY:-172.17.0.1}"
      pids_limit = 512
      no_new_privileges = true
      drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
      [egress]
      image = "opensandbox/egress:v1.1.7"
      mode = "dns+nft"
      [egress.limits]
      cpu = "100m"
      memory = "128Mi"
      [ingress]
      mode = "direct"

x-common-environment: &common-environment
  TZ: Asia/Shanghai

x-xpeech-service: &xpeech-service
  image: xpeech:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ./.env
  environment: *common-environment
  dns:
    - 10.123.14.6
    - 10.123.14.7
    - 223.5.5.5
    - 114.114.114.114
    - 8.8.8.8
  configs:
    - source: xpeech_conf
      target: /app/conf.toml
  init: true
  restart: unless-stopped

services:
  # Build explicitly before starting backend: docker compose build sandbox-image
  sandbox-image:
    image: xpeech-sandbox:local
    build:
      context: .
      dockerfile: Dockerfile
      target: sandbox
    profiles: ["build"]

  opensandbox:
    image: opensandbox/server:release-1.2.0
    environment:
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_API_KEY:?Set OPENSANDBOX_API_KEY}
    configs:
      - source: opensandbox_conf
        target: /etc/opensandbox/config.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker_data/opensandbox:/var/lib/opensandbox
      # Server validates these sources before passing them to the host daemon.
      - ./docker_data/workspace_base:${XPEECH_HOST_ROOT}/docker_data/workspace_base
      - ./xpeech/agent/skills/buildin:${XPEECH_HOST_ROOT}/xpeech/agent/skills/buildin:ro
      - ./data/sandbox-home:${XPEECH_HOST_ROOT}/data/sandbox-home:ro
      - ./docker_data/lark-cli:${XPEECH_HOST_ROOT}/docker_data/lark-cli:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  lark-token-manager:
    <<: *xpeech-service
    command: ["token_manager", "--host", "0.0.0.0", "--port", "7883"]
    # Sandboxes can reach only this service through the host bridge; their
    # egress policy denies other private-network destinations.
    ports:
      - "${SANDBOX_HOST_GATEWAY:-172.17.0.1}:7883:7883"
    volumes:
      - ./docker_data/lark-token-manager:/app/data/lark-token-manager
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7883/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  backend:
    <<: *xpeech-service
    command: ["api", "--host", "0.0.0.0", "--port", "8080", "--scheduler-url", "http://scheduler:8090"]
    environment:
      <<: *common-environment
      XPEECH_TOKEN_MANAGER_URL: http://lark-token-manager:7883
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:?Set OPENSANDBOX_API_KEY}
      XPEECH_TOOL__SHELL__HOST_WORKSPACE_ROOT: ${XPEECH_HOST_ROOT}/docker_data/workspace_base
      XPEECH_TOOL__SHELL__HOST_SKILLS_ROOT: ${XPEECH_HOST_ROOT}/xpeech/agent/skills/buildin
      XPEECH_TOOL__SHELL__HOST_HOME_CONFIG_ROOT: ${XPEECH_HOST_ROOT}/data/sandbox-home
      XPEECH_TOOL__SHELL__HOST_CLI_ROOT: ${XPEECH_HOST_ROOT}/docker_data/lark-cli
      XPEECH_TOOL__SHELL__TOKEN_MANAGER_URL: http://${SANDBOX_HOST_GATEWAY:-172.17.0.1}:7883
      XPEECH_TOOL__SHELL__STATE_PATH: /app/data/session/opensandbox
      PATH: /opt/xpeech/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    deploy:
      replicas: ${BACKEND_REPLICAS:-16}
    depends_on:
      opensandbox:
        condition: service_healthy
      lark-token-manager:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      # 内置技能及本地自定义内置技能（x-*）
      - ./xpeech/agent/skills/buildin:/app/xpeech/agent/skills/buildin:ro
      # 会话上下文
      - ./docker_data/session:/app/data/session
      # 工作目录
      - ./docker_data/workspace_base:/app/data/workspace_base
      # 沙盒内包管理器的国内镜像配置（逐用户只读映射到 HOME）
      - ./data/sandbox-home:/app/data/sandbox-home:ro
      - ./docker_data/lark-cli:/opt/xpeech/bin:ro
      # 网页预览目录
      - ./docker_data/browser_preview:/app/data/browser_preview
      # 运行日志目录
      - ./docker_data/logs:/app/data/logs
      # 头像等
      - ./assets:/app/assets:ro
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  scheduler:
    <<: *xpeech-service
    command: ["scheduler", "--host", "0.0.0.0", "--port", "8090", "--backend-url", "http://nginx:${BACKEND_PORT:-7878}"]
    deploy:
      replicas: 1
    expose:
      - "8090"
    volumes:
      - ./docker_data/session:/app/data/session
      - ./docker_data/logs/scheduler:/app/data/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:1.27.5-alpine
    depends_on:
      backend:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-7878}:${BACKEND_PORT:-7878}"
    environment:
      <<: *common-environment
      NGINX_PORT: ${BACKEND_PORT:-7878}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./docker/nginx-jwt.js:/etc/nginx/jwt.js:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:${BACKEND_PORT:-7878}/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 10s

  feishu:
    <<: *xpeech-service
    command: ["feishu", "--chat-url", "http://nginx:${BACKEND_PORT:-7878}"]
    depends_on:
      nginx:
        condition: service_healthy

  web_client:
    <<: *xpeech-service
    command: ["web_client", "--host", "0.0.0.0", "--port", "${WEB_CLIENT_PORT:-7939}", "--backend-url", "http://nginx:${BACKEND_PORT:-7878}"]
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "${WEB_CLIENT_PORT:-7939}:${WEB_CLIENT_PORT:-7939}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:${WEB_CLIENT_PORT:-7939}/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - ./docker_data/web_client:/app/data/web_client
