name: xpeech

configs:
  xpeech_env:
    file: ./.env
  xpeech_conf:
    file: ./conf.toml

x-xpeech-service: &xpeech-service
  image: xpeech:local
  build:
    context: .
    dockerfile: Dockerfile
  configs:
    - source: xpeech_env
      target: /app/.env
    - source: xpeech_conf
      target: /app/conf.toml
  init: true
  restart: unless-stopped

services:
  playwright:
    image: mcr.microsoft.com/playwright/mcp
    pull_policy: always
    init: true
    stdin_open: true
    restart: unless-stopped
    entrypoint: ["node"]
    command:
      - /app/cli.js
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --port
      - "8931"
      - --host
      - 0.0.0.0
    ports:
      - "8931:8931"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8931/mcp').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    <<: *xpeech-service
    command: ["api", "--host", "0.0.0.0", "--port", "7878"]
    ports:
      - "7878:7878"
    volumes:
      - ./docker_data/session:/app/data/session
      - ./docker_data/workspace_base:/app/data/workspace_base
      - ./docker_data/sandbox-home:/app/data/sandbox-home
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7878/docs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  feishu:
    <<: *xpeech-service
    command: ["feishu", "--chat-url", "http://backend:7878"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./docker_data/feishu_cache:/app/data/feishu_cache
