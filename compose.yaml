configs:
  xpeech_conf:
    file: ./conf.toml

x-xpeech-service: &xpeech-service
  image: xpeech:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ./.env
  environment:
    - TZ=Asia/Shanghai
  configs:
    - source: xpeech_conf
      target: /app/conf.toml
  init: true
  restart: unless-stopped

services:
  browserless:
    image: ghcr.io/browserless/chromium:v2.55.0
    init: true
    restart: unless-stopped

  backend:
    <<: *xpeech-service
    command: ["api", "--host", "0.0.0.0", "--port", "${BACKEND_PORT:-7878}"]
    depends_on:
      browserless:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-7878}:${BACKEND_PORT:-7878}"
    volumes:
      # 内置技能及本地自定义内置技能（x-*）
      - ./xpeech/agent/skills/buildin:/app/xpeech/agent/skills/buildin:ro
      # 会话上下文
      - ./docker_data/session:/app/data/session
      # 工作目录
      - ./docker_data/workspace_base:/app/data/workspace_base
      # 沙盒内包管理器的国内镜像配置（逐用户只读映射到 HOME）
      - ./data/sandbox-home:/app/data/sandbox-home:ro
      # 网页预览目录
      - ./docker_data/browser_preview:/app/data/browser_preview
      # 运行日志目录
      - ./docker_data/logs:/app/data/logs
      # 头像等
      - ./assets:/app/assets:ro
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:${BACKEND_PORT:-7878}/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  feishu:
    <<: *xpeech-service
    command: ["feishu", "--chat-url", "http://backend:${BACKEND_PORT:-7878}"]
    depends_on:
      backend:
        condition: service_healthy
    dns:
      - 223.5.5.5
      - 114.114.114.114
      - 8.8.8.8

  web_client:
    <<: *xpeech-service
    command: ["web_client", "--host", "0.0.0.0", "--port", "${WEB_CLIENT_PORT:-7939}", "--backend-url", "http://backend:${BACKEND_PORT:-7878}"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_CLIENT_PORT:-7939}:${WEB_CLIENT_PORT:-7939}"
    volumes:
      # Web 用户和登录会话数据库
      - ./docker_data/web_client:/app/data/web_client
