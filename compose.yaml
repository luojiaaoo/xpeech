name: xpeech

configs:
  xpeech_conf:
    file: ./conf.toml

x-xpeech-service: &xpeech-service
  image: xpeech:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ./.env
  configs:
    - source: xpeech_conf
      target: /app/conf.toml
  init: true
  restart: unless-stopped

services:
  browserless:
    image: ghcr.io/browserless/chromium
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"

  backend:
    <<: *xpeech-service
    command: ["api", "--host", "0.0.0.0", "--port", "7878"]
    depends_on:
      browserless:
        condition: service_started
    ports:
      - "7878:7878"
    volumes:
      - ./docker_data/session:/app/data/session
      - ./docker_data/workspace_base:/app/data/workspace_base
      - ./docker_data/sandbox-home:/app/data/sandbox-home
      - ./docker_data/browser_preview:/app/data/browser_preview
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7878/docs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  feishu:
    <<: *xpeech-service
    command: ["feishu", "--chat-url", "http://backend:7878"]
    depends_on:
      backend:
        condition: service_healthy
