configs:
  xpeech_conf:
    file: ./conf.toml

x-xpeech-service: &xpeech-service
  image: xpeech:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ./.env
  environment:
    - TZ=Asia/Shanghai
  dns:
    - 10.123.14.6
    - 10.123.14.7
    - 223.5.5.5
    - 114.114.114.114
    - 8.8.8.8
  configs:
    - source: xpeech_conf
      target: /app/conf.toml
  init: true
  restart: unless-stopped

services:
  lark-token-manager:
    <<: *xpeech-service
    command: ["token_manager", "--host", "0.0.0.0", "--port", "7883"]
    volumes:
      - ./docker_data/lark-token-manager:/app/data/lark-token-manager
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7883/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  backend:
    <<: *xpeech-service
    command: ["api", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      - TZ=Asia/Shanghai
      - XPEECH_SCHEDULER__URL=http://scheduler:8090
    deploy:
      replicas: ${BACKEND_REPLICAS:-4}
    depends_on:
      lark-token-manager:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      # 内置技能及本地自定义内置技能（x-*）
      - ./xpeech/agent/skills/buildin:/app/xpeech/agent/skills/buildin:ro
      # 会话上下文
      - ./docker_data/session:/app/data/session
      # 工作目录
      - ./docker_data/workspace_base:/app/data/workspace_base
      # 沙盒内包管理器的国内镜像配置（逐用户只读映射到 HOME）
      - ./data/sandbox-home:/app/data/sandbox-home:ro
      # 网页预览目录
      - ./docker_data/browser_preview:/app/data/browser_preview
      # 运行日志目录
      - ./docker_data/logs:/app/data/logs
      # 头像等
      - ./assets:/app/assets:ro
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  scheduler:
    <<: *xpeech-service
    command: ["scheduler", "--host", "0.0.0.0", "--port", "8090"]
    deploy:
      replicas: 1
    environment:
      - TZ=Asia/Shanghai
      - XPEECH_SCHEDULER__BACKEND_URL=http://nginx:7878
    expose:
      - "8090"
    volumes:
      - ./docker_data/session:/app/data/session
      - ./docker_data/logs/scheduler:/app/data/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:1.27.5-alpine
    depends_on:
      backend:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-7878}:7878"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:7878/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 10s

  feishu:
    <<: *xpeech-service
    command: ["feishu", "--chat-url", "http://nginx:7878"]
    depends_on:
      nginx:
        condition: service_healthy

  web_client:
    <<: *xpeech-service
    command: ["web_client", "--host", "0.0.0.0", "--port", "${WEB_CLIENT_PORT:-7939}", "--backend-url", "http://nginx:7878"]
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "${WEB_CLIENT_PORT:-7939}:${WEB_CLIENT_PORT:-7939}"
    volumes:
      # Web 用户和登录会话数据库
      - ./docker_data/web_client:/app/data/web_client
