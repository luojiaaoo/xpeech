configs:
  xpeech_conf:
    file: ./conf.toml

x-common-environment: &common-environment
  TZ: Asia/Shanghai

x-xpeech-service: &xpeech-service
  image: xpeech:local
  build:
    context: .
    dockerfile: Dockerfile
  environment: *common-environment
  dns:
    - 10.123.14.6
    - 10.123.14.7
    - 223.5.5.5
    - 114.114.114.114
    - 8.8.8.8
  configs:
    - source: xpeech_conf
      target: /app/conf.toml
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=256"]
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-xpeech}
      POSTGRES_USER: ${POSTGRES_USER:-xpeech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xpeech}
    ports:
      - "${POSTGRES_PORT:-7890}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  lark-token-manager:
    <<: *xpeech-service
    command: ["token_manager", "--host", "0.0.0.0", "--port", "7883"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7883/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  backend:
    <<: *xpeech-service
    command: ["api", "--host", "0.0.0.0", "--port", "8080", "--scheduler-url", "http://scheduler:8090"]
    environment:
      <<: *common-environment
      XPEECH_TOKEN_MANAGER_URL: http://lark-token-manager:7883
    deploy:
      replicas: ${BACKEND_REPLICAS:-8}
    depends_on:
      lark-token-manager:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      # 内置技能及本地自定义内置技能（x-*）
      - ./xpeech/agent/skills/buildin:/app/xpeech/agent/skills/buildin:ro
      # 会话上下文
      - ./data/session:/app/data/session
      # 工作目录
      - ./data/workspace_base:/app/data/workspace_base
      # 沙盒内包管理器的国内镜像配置（逐用户只读映射到 HOME）
      - ./assets/sandbox-home:/app/assets/sandbox-home:ro
      # 网页预览目录
      - ./data/browser_preview:/app/data/browser_preview
      # 运行日志目录
      - ./data/logs:/app/data/logs
      # 头像等
      - ./assets:/app/assets:ro
    cap_add:
      - SYS_ADMIN
      # slirp4netns 创建 TAP 网卡、bwrap 配置独立网络中的 loopback
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  scheduler:
    <<: *xpeech-service
    command: ["scheduler", "--host", "0.0.0.0", "--port", "8090", "--backend-url", "http://nginx:${BACKEND_PORT:-7878}"]
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8090"
    volumes:
      - ./data/logs/scheduler:/app/data/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:1.27.5-alpine
    depends_on:
      backend:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-7878}:${BACKEND_PORT:-7878}"
    environment:
      <<: *common-environment
      NGINX_PORT: ${BACKEND_PORT:-7878}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./docker/nginx-jwt.js:/etc/nginx/jwt.js:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:${BACKEND_PORT:-7878}/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 10s

  feishu:
    <<: *xpeech-service
    command: ["feishu", "--chat-url", "http://nginx:${BACKEND_PORT:-7878}"]
    depends_on:
      nginx:
        condition: service_healthy

  web_client:
    <<: *xpeech-service
    command: ["web_client", "--host", "0.0.0.0", "--port", "${WEB_CLIENT_PORT:-7939}", "--backend-url", "http://nginx:${BACKEND_PORT:-7878}"]
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "${WEB_CLIENT_PORT:-7939}:${WEB_CLIENT_PORT:-7939}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:${WEB_CLIENT_PORT:-7939}/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - ./data/web_client:/app/data/web_client
