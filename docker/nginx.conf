worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream xpeech_backend {
        # Docker's embedded DNS returns every replica for the backend service.
        # Re-resolve it so replacing or scaling replicas does not require an
        # nginx restart. Dynamic upstream DNS is available in nginx >= 1.27.3.
        resolver 127.0.0.11 valid=10s ipv6=off;
        zone xpeech_backend 64k;

        # /chat and /answer_question keep process-local state. The same user
        # therefore has to reach the same backend for every related request.
        # Use consistent hashing (ketama) so that scaling or replacing
        # replicas only remaps ~1/N of keys instead of nearly all of them.
        hash $http_x_user_id consistent;
        server backend:8080 resolve;
        keepalive 64;
    }

    server {
        listen 7878;
        server_name _;

        client_max_body_size 0;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep SSE and long-running scheduled executions streaming.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        location / {
            # Never replay an Agent execution on another backend after failure.
            proxy_next_upstream off;
            proxy_pass http://xpeech_backend;
        }
    }
}