load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    js_import jwt from /etc/nginx/jwt.js;
    js_set $user_id jwt.userId;

    upstream xpeech_backend {
        # Docker's embedded DNS returns every replica for the backend service.
        # Re-resolve it so replacing or scaling replicas does not require an
        # nginx restart. Dynamic upstream DNS is available in nginx >= 1.27.3.
        resolver 127.0.0.11 valid=10s ipv6=off;
        zone xpeech_backend 64k;

        # Hash only JWT sub; requests without it use round-robin.
        # Hash resolved peers directly. With a single DNS server name,
        # "consistent" hashes the name and round-robins its replica IPs,
        # sending chat and answer_question to different in-memory sessions.
        # The backend handles JWT verification. Replica changes can remap users.
        hash $user_id;
        server backend:8080 resolve;
        keepalive 64;
    }

    server {
        listen ${NGINX_PORT};
        server_name _;

        client_max_body_size 0;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep SSE and synchronous chat executions open.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        location / {
            # Never replay an Agent execution on another backend after failure.
            proxy_next_upstream off;
            proxy_pass http://xpeech_backend;
        }
    }
}
