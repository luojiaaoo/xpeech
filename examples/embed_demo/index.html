<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xpeech 本地嵌入演示</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7fb; color: #18213d; font: 16px/1.7 system-ui, sans-serif; }
    main { max-width: 780px; margin: 12vh auto; padding: 36px; }
    article { padding: 36px; border: 1px solid #dfe5ef; border-radius: 20px; background: white; box-shadow: 0 12px 48px #152c670c; }
    .tag { color: #3370ff; font-size: 13px; font-weight: 600; letter-spacing: .12em; }
    h1 { margin: 10px 0; font-size: 30px; }
    p { color: #5b6578; }
    dl { padding: 18px 22px; background: #f4f7fb; border-radius: 12px; }
    dt { color: #5b6578; font-size: 13px; }
    dd { margin: 0 0 12px; overflow-wrap: anywhere; }
    dd:last-child { margin: 0; }
    button { border: 0; border-radius: 9px; padding: 10px 18px; background: #3370ff; color: white; cursor: pointer; font: inherit; margin: 4px 6px 4px 0; }
    button.secondary { color: #18213d; background: #edf1f8; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { font-size: 14px; margin-top: 20px; }
    textarea, input { width: 100%; padding: 12px; border: 1px solid #dfe5ef; border-radius: 9px; font: inherit; }
    #replies { white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 600px) { main { margin: 24px auto; padding: 16px; } article { padding: 24px; } }
  </style>
</head>
<body>
  <main><article>
    <span class="tag">XPEECH · 本地接入演示</span>
    <h1>你的 AI 助手已接入</h1>
    <p>点击右下角的聊天按钮，或使用下方按钮展开对话。关闭窗口后，再次打开可继续当前会话。</p>
    <dl>
      <dt><label for="service">聊天前端 URL</label></dt>
      <dd>
        <form id="connection">
          <input id="service" type="url" required placeholder="http://localhost:7939/" disabled>
          <button id="connect" type="submit" disabled>连接 / 重新连接</button>
        </form>
      </dd>
      <dt>通道</dt><dd id="channel">—</dd>
      <dt>演示用户</dt><dd id="user">—</dd>
      <dt>发送者名称</dt><dd id="sender">—</dd>
      <dt>助手标题</dt><dd id="assistant-title">—</dd>
      <dt>会话元数据</dt><dd id="metadata">—</dd>
    </dl>
    <button id="open" disabled>打开聊天</button>
    <button id="toggle" class="secondary" disabled>退出演示登录</button>
    <label for="prompt">主页面交互内容</label>
    <textarea id="prompt" rows="3">请介绍一下你能做什么</textarea>
    <button id="fill" class="secondary" disabled>填入对话输入框</button>
    <button id="sync" disabled>同步发送</button>
    <div id="replies" aria-live="polite"></div>
    <p id="status" role="status">正在加载聊天组件…</p>
  </article></main>
  <script type="module">
    const status = document.querySelector('#status');
    const open = document.querySelector('#open');
    const toggle = document.querySelector('#toggle');
    const fill = document.querySelector('#fill');
    const sync = document.querySelector('#sync');
    const prompt = document.querySelector('#prompt');
    const replies = document.querySelector('#replies');
    const service = document.querySelector('#service');
    const connect = document.querySelector('#connect');
    let assistant;
    let senderName;
    let assistantTitle;
    let sessionMetadata;
    let loggedIn = false;
    let connectionVersion = 0;
    window.addEventListener('xpeech:error', event => {
      status.textContent = `连接失败：${event.detail.message}`;
    });
    async function loadJWT() {
      const response = await fetch('/api/assistant/jwt', { credentials: 'same-origin', cache: 'no-store' });
      if (!response.ok) throw new Error('获取登录凭证失败');
      const { jwt } = await response.json();
      return jwt;
    }
    function login() {
      assistant.init(loadJWT, senderName, assistantTitle, sessionMetadata);
      assistant.onReply(({ content }) => {
        const reply = document.createElement('p');
        reply.textContent = `模型回复：${content}`;
        replies.appendChild(reply);
      });
      loggedIn = true;
      open.disabled = false;
      fill.disabled = sync.disabled = false;
      toggle.textContent = '退出演示登录';
      status.textContent = '演示用户已登录，聊天组件自动获取并续签凭证。';
    }
    async function connectService() {
      let url;
      try {
        url = new URL(service.value.trim());
        if (!['http:', 'https:'].includes(url.protocol)) throw new Error('请输入 HTTP 或 HTTPS 地址');
      } catch (error) {
        status.textContent = `前端 URL 无效：${error.message}`;
        return;
      }
      connectionVersion++;
      service.disabled = connect.disabled = true;
      open.disabled = fill.disabled = sync.disabled = toggle.disabled = true;
      loggedIn = false;
      assistant?.destroy();
      assistant = undefined;
      replies.replaceChildren();
      service.value = url.origin;
      status.textContent = '正在连接聊天前端…';
      try {
        assistant = await import(new URL('/embed.js', url).href);
        login();
        toggle.disabled = false;
      } catch (error) {
        assistant?.destroy();
        assistant = undefined;
        status.textContent = `连接失败：${error.message}。请修改地址后重新连接。`;
      } finally {
        service.disabled = connect.disabled = false;
      }
    }
    try {
      const response = await fetch('/api/config', { cache: 'no-store' });
      if (!response.ok) throw new Error('读取演示配置失败');
      const config = await response.json();
      senderName = config.sender_name;
      assistantTitle = config.title;
      sessionMetadata = config.session_metadata;
      service.value = config.assistant_url;
      document.querySelector('#channel').textContent = config.channel;
      document.querySelector('#user').textContent = config.user_id;
      document.querySelector('#sender').textContent = config.sender_name;
      document.querySelector('#assistant-title').textContent = config.title;
      document.querySelector('#metadata').textContent = JSON.stringify(config.session_metadata);
      document.querySelector('#connection').addEventListener('submit', event => {
        event.preventDefault();
        void connectService();
      });
      open.addEventListener('click', () => assistant.open());
      fill.addEventListener('click', async () => {
        const version = connectionVersion;
        try {
          assistant.open();
          await assistant.setInput(prompt.value);
          if (version === connectionVersion) status.textContent = '已填入输入框，等待用户发送。';
        } catch (error) { if (version === connectionVersion) status.textContent = error.message; }
      });
      sync.addEventListener('click', async () => {
        const version = connectionVersion;
        sync.disabled = true;
        status.textContent = '正在等待同步回复…';
        try {
          assistant.open();
          const { events } = await assistant.chatSync(prompt.value);
          if (version !== connectionVersion) return;
          const failure = events.find(event => event.event === 'error');
          status.textContent = failure ? `同步交互失败：${failure.context}` : '同步交互完成，回复已回传主页面。';
        } catch (error) { if (version === connectionVersion) status.textContent = error.message; }
        finally { if (version === connectionVersion) sync.disabled = !loggedIn; }
      });
      toggle.addEventListener('click', () => {
        if (loggedIn) {
          connectionVersion++;
          assistant.destroy();
          loggedIn = false;
          open.disabled = true;
          fill.disabled = sync.disabled = true;
          toggle.textContent = '重新登录演示';
          status.textContent = '已退出演示登录，聊天组件已销毁。';
        } else login();
      });
      await connectService();
    } catch (error) {
      status.textContent = `加载失败：${error.message}`;
    }
  </script>
</body>
</html>
