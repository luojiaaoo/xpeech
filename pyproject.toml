[project]
name = "xpeech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "APScheduler>=3.11,<4",
    "aiofiles>=25.1.0",
    "aiosqlite>=0.21.0",
    "arxiv>=2.1.3",
    "async-lru>=2.3.0",
    "asyncer>=0.0.17",
    "baidusearch>=1.0.3",
    "charset-normalizer>=3.4.7",
    "fastapi>=0.136.1",
    "firecrawl-anydoc>=0.2.4",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "jq>=1.8.0",
    "lark-channel-sdk>=1.4.0",
    "litellm>=1.83.0",
    "loguru>=0.7.3",
    "mcp>=1.28.1",
    "moviepy>=1.0.3",
    "openai>=2.36.0",
    "pillow>=12.2.0",
    "pyjwt>=2.12.1",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.27",
    "requests>=2.32.0",
    "sqlmodel>=0.0.39",
    "trafilatura>=2.3.1",
    "tzdata>=2026.2",
    "uvicorn[standard]>=0.46.0",
    "yarl>=1.23.0",
    "uuid6>=2025.0.1",
]

[[tool.uv.index]]
name = "tencent"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[dependency-groups]
benchmark = [
    "guidellm[recommended]>=0.7.2",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "tomlkit>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
