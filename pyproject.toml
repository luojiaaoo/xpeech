[project]
name = "xpeech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "APScheduler>=3.11,<4",
    "aiofiles>=25.1.0",
    "aiosqlite>=0.21.0",
    "async-lru>=2.3.0",
    "asyncer>=0.0.17",
    "charset-normalizer>=3.4.7",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "jq>=1.8.0",
    "lark-channel-sdk>=1.4.0",
    "loguru>=0.7.3",
    "opensandbox==1.1.1",
    "pyjwt>=2.12.1",
    "pydantic-settings>=2.14.0",
    "PyYAML>=6.0",
    "python-multipart>=0.0.27",
    "sqlmodel>=0.0.39",
    "SQLAlchemy[asyncio]>=2.0",
    "tzdata>=2026.2",
    "uvicorn[standard]>=0.46.0",
    "yarl>=1.23.0",
]

[[tool.uv.index]]
name = "tencent"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[dependency-groups]
benchmark = [
    "guidellm[recommended]>=0.7.2",
]
dev = [
    "xpeech-runtime",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "tomlkit>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xpeech"]

[tool.hatch.build.targets.sdist]
only-include = ["xpeech", "runtime", "tests", "assets", "custom_tools", "feishu.lark-cli", "docs", "README.md", "pyproject.toml", "uv.lock", "Dockerfile", "compose.yaml", "conf.toml.example", ".env.example"]
exclude = ["**/__pycache__", "**/node_modules", "**/dist", "/xpeech/docker_data"]

[tool.uv.workspace]
members = ["runtime"]

[tool.uv.sources]
xpeech-runtime = { workspace = true }
