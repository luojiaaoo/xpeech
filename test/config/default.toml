[llm]
model = "default-model"
timeout = 30
api_key = "${OPENAI_API_KEY}"
base_url = "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
special_chars = "${SPECIAL_CHARS_SECRET}"
literal_placeholder = "$${OPENAI_API_KEY}"
tags = ["agent", "${EXTRA_TAG:-local}"]

[agent]
max_steps = 20
tools = ["filesystem", "${EXTRA_TOOL:-shell}"]

[history]
enabled = true
path = "history.json"
